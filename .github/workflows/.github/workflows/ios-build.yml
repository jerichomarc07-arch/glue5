
name: Build Glue 5 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install project tools
        run: mise install

      - name: Prepare dependencies
        run: mise run setup

      - name: Build unsigned iOS app
        run: mise run ios:build

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="target/ios/derived/Build/Products/Release-iphoneos/Glue 5.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Glue5-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Glue5-unsigned-IPA
          path: Glue5-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
